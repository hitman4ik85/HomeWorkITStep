<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Document</title>
</head>

<body>
    <div class="main">
        <div class="forms">
            <form class="registration_form" action="">
                <h2>Registration form</h2>
                <div class="username">
                    <img src="/icons/username.png" alt="">
                    <input type="text" placeholder="Username">
                </div>
                <div class="email">
                    <img src="/icons/email.png" alt="">
                    <input type="email" placeholder="Email address">
                </div>
                <div class="password_div">
                    <img src="/icons/pswd.png" alt="">
                    <div class="password">
                        <input type="password" placeholder="Password">
                        <input type="password" placeholder="Confirm password">
                    </div>
                </div>
                <div class="check_inputs">
                    <div class="CheckBox">
                        <input id="checkBox" type="checkbox">
                        <label for="checkbox">I want to receive news and special offers</label>
                    </div>
                    <div class="CheckBox">
                        <input id="checkBox" type="checkbox">
                        <label for="checkbox">I agree with the Terms and Conditions</label>
                    </div>
                </div>
            </form>
            <form class="personal_details" action="">
                <h2>Personal details</h2>
                <div class="names">
                    <input type="text" placeholder="First name">
                    <input type="text" placeholder="Last name">
                </div>
                <div class="info">
                    <select class="form_select">
                        <option selected>Male</option>
                        <option value="1">Female</option>
                    </select>
                    <input id="date_media" type="date">
                </div>
                <div class="check_inputs_media">
                    <div class="CheckBox">
                        <input id="checkBox" type="checkbox">
                        <label for="checkbox">I want to receive news and special offers</label>
                    </div>
                    <div class="CheckBox">
                        <input id="checkBox" type="checkbox">
                        <label for="checkbox">I agree with the Terms and Conditions</label>
                    </div>
                </div>
            </form>
        </div>
        <div class="butt_submit">
            <button class="button_sub">Submit</button>
        </div>
    </div>
</body>

</html>
