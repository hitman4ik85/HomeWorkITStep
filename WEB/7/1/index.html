<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="name-card">CREDIT CARD DETAILS</div>
        <div class="img-card">
          <img class="img" src="icons/moon_flag.png" alt="moon">
        </div>
        <div class="form-container">
          <div class="form-group">
            <label for="name-on-card">Name On Card</label>
            <input type="text" id="name-on-card" name="name-on-card" placeholder="Enter the name on your card">
          </div>
          <div class="form-group">
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" name="card-number" placeholder="Enter your card number">
          </div>
          <div class="expiry-cvv-group">
            <div class="form-group expiry-group">
              <label for="expiry-month">Expiry Month</label>
              <input type="text" id="expiry-month" name="expiry-month" placeholder="MM">
            </div>
            <div class="form-group expiry-group">
              <label for="expiry-year">Expiry Year</label>
              <input type="text" id="expiry-year" name="expiry-year" placeholder="YYYY">
            </div>
            <div class="form-group cvv-group">
              <label for="cvv">CVV / CVN</label>
              <input type="text" id="cvv" name="cvv" placeholder="Enter CVV / CVN">
            </div>
          </div>
         </div>
         
      </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

</html>
