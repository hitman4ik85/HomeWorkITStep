<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Spisok_prodyktov</title>
</head>
<body>
  <div class="header"><h2>What do I have in my fridge?</h2></div>
    <div class="main-list">
        <div id="items" class="paper">
            <img src="img/Food_C247-128.png" alt="paper-icon">
            <h3>Pepper</h3>
        </div>
        <div id="items" class="apple">
            <img src="img/Food_C240-128.png" alt="apple-icon">
            <h3>Apple</h3>
        </div>
        <div id="items" class="cheese">
            <img src="img/Food_C217-128.png" alt="cheese-icon">
            <h3>Cheese</h3>
        </div>
        <div id="items" class="corn">
            <img src="img/Food_C245-128.png" alt="corn-icon">
            <h3>Corn</h3>
        </div>
        <div id="items" class="mushroom">
            <img src="img/Food_C239-128.png" alt="mushroom-icon">
            <h3>Mushroom</h3>
        </div>
        <div id="items" class="garlic">
            <img src="img/Food_C238-128.png" alt="garlic-icon">
            <h3>Garlic</h3>
        </div>
        <div id="items" class="beef">
            <img src="img/Food_C225-128.png" alt="beef-icon">
            <h3>Beef</h3>
        </div>
        <div id="items" class="fish">
            <img src="img/Food_C205-128.png" alt="fish-icon">
            <h3>Fish</h3>
        </div>
        <div id="items" class="eggs">
            <img src="img/Food_C203-128.png" alt="eggs-icon">

        </div>
        <div id="items" class="coriander">

    </div>
  <div class="footer"><h2>... that`s all ...</h2></div>

</html>
