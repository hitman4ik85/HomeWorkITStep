<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assecs/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <form class="row g-3 needs-validation" novalidate>
        <div class="col-md-4">
            <label for="validationCustom01" class="form-label">Inputs</label>
            <div class="inputs">
                <input type="text" class="form-control" id="validationCustom01" placeholder="Enter some Text" disabled>
                <input type="text" class="form-control" id="validationCustom01" placeholder="Enter some Text" required>
                <input type="text" class="form-control" id="validationCustom01" placeholder="Enter some Text" required>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Submit form</button>
            </div>
        </div>
        <label for="validationCustom01" class="form-label">Check boxes</label>
        <div class="switches">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault">
                <label class="form-check-label" for="flexSwitchCheckDefault">Subscribe</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked" checked>
                <label class="form-check-label" for="flexSwitchCheckChecked">Subscribe</label>
            </div>
        </div>
        <label for="validationCustom01" class="form-label">Radio buttons</label>
        <div class="radioBut">
            <div class="text">Gender:</div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios1" value="option1"
                    checked>
                <label class="form-check-label" for="exampleRadios1">
                    Male
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="exampleRadios" id="exampleRadios2" value="option2">
                <label class="form-check-label" for="exampleRadios2">
                    Female
                </label>
            </div>
        </div>
        <label for="validationCustom01" class="form-label">Buttons</label>
        <div class="buttons">
            <button type="button" class="btn btn-success">Active</button>
            <button type="button" class="btn btn-success">Hover</button>
            <button type="button" class="btn btn-danger">Danger</button>
            <button type="button" class="btn btn-danger">Hover</button>
            <button type="button" class="btn btn-secondary" disabled>Disabled</button>
            <button type="button" class="btn btn-success" id="button_sign">+</button>
            <button type="button" class="btn btn-danger" id="button_sign">-</button>
        </div>
        <label for="validationCustom01" class="form-label">Text area</label>
        <div class="form-floating">
            <textarea class="form-control" placeholder="Enter some text..." id="floatingTextarea2"
                style="height: 100px"></textarea>
        </div>




    </form>
</body>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>

</html>
