<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assecs/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <div class="main_div">
        <div class="header">
            <div class="header_title">Credit card details</div>
        </div>
        <div class="main_content">
            <form class="Form" action="/submit_credit_card_info" method="post">
                <div class="number_card">
                    <label for="card_number">Card Number</label>
                    <input type="text" placeholder="1234 5678 9012 3456" id="card_number" name="card_number"
                        pattern="[0-9]{13,16}" required>
                </div>
                <div class="name_surname">
                    <label for="card_name">Name On Card</label>
                    <input type="text" placeholder="Name Surname" id="card_name" name="card_name" required>
                </div>
                <div class="Expiry_Date_CVV">
                    <div class="date_cvv">
                        <label for="expiry_month">Expiry Date</label>
                        <label for="cvv">CVV / CVN</label>
                    </div>
                    <div class="Forms_Date_CVV">
                        <input type="text" placeholder="02" id="expiry_month" name="expiry_month" pattern="(0[1-9]|1[0-2])"
                            required>
                        <input type="text" placeholder="2017" id="expiry_year" name="expiry_year" pattern="[0-9]{4}"
                            required>
                        <input type="text" placeholder="***" id="cvv" name="cvv" pattern="[0-9]{3,4}" required>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
    crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
    crossorigin="anonymous"></script>
</html>
